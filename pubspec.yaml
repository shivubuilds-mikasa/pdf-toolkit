name: pdf_toolkit
description: "A comprehensive offline PDF management utility."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.9
  pdf: ^3.10.8
  syncfusion_flutter_pdf: any
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  permission_handler: ^11.1.0
  flutter_pdfview: ^1.3.2
  google_mlkit_document_scanner: ^0.2.0
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  intl: any
  open_filex: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
