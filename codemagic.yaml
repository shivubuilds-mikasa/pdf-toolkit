
workflows:
  ios-pdf-toolkit:
    name: PDF Toolkit - iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.9
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pdftoolkit.app.pdfToolkit
    scripts:
      - name: Check Flutter setup
        script: flutter --version
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed iOS IPA
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
